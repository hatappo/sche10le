<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <style>
      {{THEME}}
      {{PANEL_CSS}}
      body { min-width: 0; }
      [data-view] { display: none; }
      body[data-demo="list"] [data-view="list"], body[data-demo="pick"] [data-view="pick"], body[data-demo="settings"] [data-view="settings"] { display: block; }
      body[data-demo="pick"] .selection-actions { display: flex; }
      body[data-demo="settings"] .footer { display: none; }
      body[data-demo="settings"] .settings { display: flex; }
      .candidate .variant-region { visibility: hidden; }
      .candidate.expanded .variant-region { visibility: visible; }
    </style>
  </head>
  <body data-demo="list">
    <main data-view="list">
      <div class="source-section">
        <h2 class="stage-title" data-state="complete">
          <span class="stage-label">スキャン</span
          ><span class="stage-check" aria-hidden="true">✓</span
          ><span class="sr-only">：完了</span>
        </h2>
        <button class="reload-button rescan-link">再スキャン</button>
        <div class="source-text">
          <span class="muted">example.com</span
          ><span class="scan-result">1件</span>
        </div>
      </div>
      <div class="section-heading candidates-heading">
        <h2 class="stage-title" data-state="active" aria-current="step">
          <span class="stage-label">日時</span
          ><span class="stage-check" aria-hidden="true">✓</span
          ><span class="sr-only">：操作中</span>
        </h2>
        <select class="order-select" aria-label="候補の並び順">
          <option>登場順</option>
          <option>日時順</option>
        </select>
      </div>
      <div class="candidate">
        <div
          class="candidate-heading"
          tabindex="0"
          role="group"
          aria-label="11月10日（火）14:00–16:00。ページ本文の日付を自動抽出"
        >
          <span class="date-badge"
            ><span class="month">NOV</span><span class="day">10</span></span
          ><span
            class="date-content"
            title="ページ本文の日付を自動抽出&#10;2026年11月10日 14:00〜16:00"
            ><strong>11月10日（火）</strong
            ><span class="candidate-time">14:00–16:00</span
            ><span class="sr-only">ページ本文の日付を自動抽出</span></span
          ><span class="candidate-arrow">›</span>
        </div>
        <div class="variant-region" id="variants" inert>
          <div class="variant-inner">
            <div class="variant-list">
              <button class="variant">
                <span class="variant-label">時間どおり</span
                ><span class="variant-time">14:00–16:00</span
                ><span class="variant-arrow">→</span></button
              ><button class="variant">
                <span class="variant-label">移動込み</span
                ><span class="variant-time">13:30–16:30</span
                ><span class="variant-arrow">→</span></button
              ><button class="variant">
                <span class="variant-label">終日</span
                ><span class="variant-time">11/10</span
                ><span class="variant-arrow">→</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>
    <main data-view="pick">
      <div class="source-section">
        <h2 class="stage-title" data-state="complete">
          <span class="stage-label">スキャン</span
          ><span class="stage-check" aria-hidden="true">✓</span
          ><span class="sr-only">：完了</span>
        </h2>
        <button class="reload-button rescan-link">再スキャン</button>
        <div class="source-text">
          <span class="muted">example.com</span
          ><span class="scan-result">1件</span>
        </div>
      </div>
      <div class="section-heading candidates-heading">
        <h2 class="stage-title" data-state="complete">
          <span class="stage-label">日時</span
          ><span class="stage-check" aria-hidden="true">✓</span
          ><span class="sr-only">：完了</span>
        </h2>
        <div class="selection-actions">
          <button class="text-button" id="reset">選び直す</button>
        </div>
      </div>
      <article class="candidate selected">
        <div
          class="candidate-heading"
          role="group"
          aria-label="11月10日（火）14:00–16:00。ページ本文の日付を自動抽出"
        >
          <span class="date-badge"
            ><span class="month">NOV</span><span class="day">10</span></span
          ><span
            class="date-content"
            title="ページ本文の日付を自動抽出&#10;2026年11月10日 14:00〜16:00"
            ><strong>11月10日（火）</strong
            ><span class="candidate-time">14:00–16:00</span
            ><span class="sr-only">ページ本文の日付を自動抽出</span></span
          ><span class="candidate-arrow">›</span>
        </div>
        <p class="registration-summary" id="variant-label">
          時間どおり 14:00–16:00
        </p>
      </article>
      <section class="selection">
        <h2 class="stage-title" data-state="active" aria-current="step">
          <span class="stage-label">内容</span
          ><span class="stage-check" aria-hidden="true">✓</span
          ><span class="sr-only">：操作中</span>
        </h2>
        <div class="picked-values">
          <button class="field-row" aria-current="step">
            <span class="field-heading"
              ><span class="field-label"
                ><span class="field-number" aria-hidden="true">1</span
                >タイトル</span
              ><span class="field-check" aria-hidden="true" hidden>✓</span
              ><span class="field-edit">✎</span></span
            ><span class="field-value">活版印刷のワークショップ</span>
          </button>
          <button class="field-row">
            <span class="field-heading"
              ><span class="field-label"
                ><span class="field-number" aria-hidden="true">2</span
                >場所</span
              ><span class="field-check" aria-hidden="true" hidden>✓</span
              ><span class="field-edit">✎</span></span
            ><span class="field-value is-empty">未設定</span>
          </button>
          <button class="field-row">
            <span class="field-heading"
              ><span class="field-label"
                ><span class="field-number" aria-hidden="true">3</span
                >詳細</span
              ><span class="field-check" aria-hidden="true" hidden>✓</span
              ><span class="field-edit">✎</span></span
            ><span class="field-value">https://example.com/workshop</span>
          </button>
        </div>
      </section>
    </main>
    <section data-view="settings" class="settings">
      <div class="section-heading">
        <h2>設定</h2>
        <button class="text-button" id="close-settings">閉じる</button>
      </div>
      <p class="settings-note">変更は自動保存されます</p>
      <div class="setting-group">
        <label for="travel"
          >前後の移動時間 <span class="muted">片道あたり</span></label
        >
        <div class="number-control">
          <input
            id="travel"
            type="number"
            value="30"
            step="5"
            min="0"
            max="180"
          /><span>分ずつ</span>
        </div>
      </div>
      <div class="setting-group">
        <label for="format">タイトルの書式</label
        ><input id="format" class="format-input" value="{from:HHmm} {title}" />
        <div class="format-preview" style="margin-top: 10px">
          <span>プレビュー</span><output>1400 活版印刷のワークショップ</output>
        </div>
      </div>
      <div class="setting-group">
        <label class="checkbox-label"
          ><input type="checkbox" />利用できる場合はローカルAIで補完</label
        >
      </div>
      <p class="settings-quote">
        <span class="tiny-dot" aria-hidden="true"></span
        ><span title="Lost time is never found again. — Benjamin Franklin"
          >失った時間は二度と戻らない。</span
        >
      </p>
    </section>
    <footer class="footer">
      <div id="open-area" data-view="pick">
        <div class="open-actions">
          <button class="primary-button" id="calendar">
            Googleカレンダーで開く <span>↗</span>
          </button>
          <button
            id="download-demo"
            class="download-button"
            type="button"
            title="予定をダウンロード（.ics）"
            aria-label="予定をダウンロード（.ics）"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path
                d="M12 3v12m-4-4 4 4 4-4M4 16v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"
              />
            </svg>
          </button>
        </div>
        <p class="footer-hint">
          情報の取得は途中でもOK。保存は Google カレンダーで。
        </p>
      </div>
      <div class="footer-tools">
        <div class="brand" aria-label="Sche10le">
          <img src="{{BRAND_ICON}}" width="24" height="24" alt="" /><span
            >sche<span class="brand-ten">10</span>le<span class="brand-period"
              >.</span
            ></span
          >
        </div>
        <button
          id="gear"
          class="settings-button"
          aria-label="設定"
          title="設定"
        >
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="currentColor"
            aria-hidden="true"
          >
            <path
              fill-rule="evenodd"
              d="M18.467 9.321L20.803 10.129L20.803 13.871L18.467 14.679L18.467 14.679L19.548 16.902L16.902 19.548L14.679 18.467L14.679 18.467L13.871 20.803L10.129 20.803L9.321 18.467L9.321 18.467L7.098 19.548L4.452 16.902L5.533 14.679L5.533 14.679L3.197 13.871L3.197 10.129L5.533 9.321L5.533 9.321L4.452 7.098L7.098 4.452L9.321 5.533L9.321 5.533L10.129 3.197L13.871 3.197L14.679 5.533L14.679 5.533L16.902 4.452L19.548 7.098L18.467 9.321Z M12 8.8a3.2 3.2 0 1 0 0 6.4a3.2 3.2 0 1 0 0-6.4Z"
            />
          </svg>
        </button>
      </div>
    </footer>
    <script>
      const footer = document.querySelector(".footer");
      new ResizeObserver(() => {
        const height = footer.getBoundingClientRect().height;
        if (height > 0)
          document.documentElement.style.setProperty(
            "--footer-height",
            `${height}px`,
          );
      }).observe(footer);
      const card = document.querySelector(".candidate");
      function expand(on) {
        card.classList.toggle("expanded", on);
        document.querySelector(".variant-region").inert = !on;
      }
      function view(name) {
        document.body.dataset.demo = name;
        expand(false);
        const input = document.getElementById("format");
        input.value = "{from:HHmm} {title}";
        input.removeAttribute("aria-invalid");
        const preview = document.querySelector(".format-preview");
        preview.classList.remove("error");
        preview.querySelector("span").textContent = "プレビュー";
        preview.querySelector("output").textContent =
          "1400 活版印刷のワークショップ";
        parent.postMessage({ type: "demo-view", view: name }, "*");
      }
      card.addEventListener("pointerenter", (event) => {
        if (event.pointerType !== "touch") expand(true);
      });
      card.addEventListener("pointerleave", (event) => {
        if (event.pointerType === "touch") return;
        if (!(
          card.contains(document.activeElement) &&
          document.activeElement?.matches(":focus-visible")
        ))
          expand(false);
      });
      card.addEventListener("focusin", () => expand(true));
      card.addEventListener("focusout", (e) => {
        if (!card.contains(e.relatedTarget) && !card.matches(":hover"))
          expand(false);
      });
      document.querySelectorAll(".variant").forEach((button) =>
        button.addEventListener("click", () => {
          const label = button.querySelector(".variant-label").textContent;
          document.getElementById("variant-label").textContent =
            label +
            (label === "終日"
              ? ""
              : " " + button.querySelector(".variant-time").textContent);
          view("pick");
        }),
      );
      document.getElementById("reset").onclick = () => {
        view("list");
        document.querySelector(".order-select").focus();
        expand(false);
      };
      document.getElementById("gear").onclick = () => view("settings");
      document.getElementById("close-settings").onclick = () => view("list");
      document.querySelectorAll(".field-row").forEach(
        (row) =>
          (row.onclick = () => {
            document.querySelectorAll(".field-row").forEach((other) => {
              other.removeAttribute("aria-current");
            });
            row.setAttribute("aria-current", "step");
          }),
      );
      document.getElementById("download-demo").onclick = () =>
        parent.postMessage(
          {
            type: "demo-notice",
            text: "資料用の見本です。拡張機能では、現在の予定を .ics ファイルとしてダウンロードします。",
          },
          "*",
        );
      document.getElementById("calendar").onclick = () =>
        parent.postMessage(
          {
            type: "demo-notice",
            text: "資料用の見本です。実際のカレンダーは開きません。",
          },
          "*",
        );
      window.addEventListener("message", (e) => {
        if (e.source !== parent) return;
        if (["list", "pick", "settings"].includes(e.data?.view))
          view(e.data.view);
        if (e.data?.action === "error") {
          view("settings");
          const input = document.getElementById("format");
          input.value = "{unknown}";
          input.setAttribute("aria-invalid", "true");
          const preview = document.querySelector(".format-preview");
          preview.classList.add("error");
          preview.querySelector("span").textContent = "書式を確認してください";
          preview.querySelector("output").textContent =
            "未対応の指定です: {unknown}";
        }
      });
    </script>
  </body>
</html>
