<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sche10le — アイコン比較案</title>
<style>
  *{box-sizing:border-box}body{margin:0;background:#f3f1e8;color:#253d32;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}
  main{max-width:1120px;margin:auto;padding:42px 36px}header{display:flex;justify-content:space-between;align-items:end;margin-bottom:26px;gap:20px}
  h1{font-family:Georgia,serif;font-size:34px;font-weight:400;margin:0 0 8px;letter-spacing:-1px}p{margin:0;font-size:13px;line-height:1.8;color:#68766a}
  .note{font-size:11px;white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
  article{border:1px solid #d9ded2;border-radius:18px;background:#fbfaf5;padding:22px;min-width:0}h2{font-size:14px;font-weight:600;margin:0;display:flex;gap:9px;align-items:center}
  h2 span{font-family:Georgia,serif;font-size:16px;color:#82917e;font-weight:400}.stage{height:158px;display:flex;align-items:center;justify-content:center}
  .sizes{display:flex;gap:22px;align-items:end;justify-content:center;margin-bottom:16px}.sizes>div{display:grid;justify-items:center;gap:5px}.sizes small{font-size:9px;color:#8b9388}
  .caption{font-size:12px;line-height:1.7;min-height:41px}svg{display:block;overflow:visible}.reference{background:#eeeee6}
  footer{margin-top:22px;font-size:11px;color:#788473;line-height:1.8}@media(max-width:740px){main{padding:24px 18px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}header{display:block}.note{margin-top:12px}.stage{height:140px}}@media(max-width:420px){.grid{grid-template-columns:1fr}}
</style>
<main>
  <header><div><h1>sche10le. / icon studies</h1><p>カレンダーの形と「10」を残して、「見つける」をどう添えるか。</p></div><p class="note">比較用の試作 · 配布アイコンには未反映</p></header>
  <div class="grid" id="options"></div>
  <footer>大きい図は128px。下段は16 / 32 / 48pxの実寸です。A・Bの虫眼鏡はカレンダーの横線と同じ白27%で、反射のみ少し明るくしています。<br>細い反射は小さいサイズでは省略できる装飾として扱い、数字の読みやすさを優先します。</footer>
</main>
<script>
  const green = '#2c5e47';
  const paper = '#faf9f2';
  const faint = 'rgba(255,255,255,.27)';
  const calendar = `<rect x="1" y="0" width="30" height="32" rx="7" fill="${green}"/><path d="M7 7.5h18" stroke="${faint}"/>`;
  const number = `<text x="15.5" y="25" text-anchor="middle" fill="${paper}" font-family="Georgia,serif" font-size="16" letter-spacing="-1">10</text>`;
  function lens(cx,cy,r,color,reflection=false){return `<g fill="none" stroke="${color}" stroke-linecap="round"><circle cx="${cx}" cy="${cy}" r="${r}" stroke-width="1.2"/><path d="M${cx+r*.71} ${cy+r*.71}l4.4 4.4" stroke-width="2"/></g>${reflection?`<path d="M${cx-r*.68} ${cy-r*.12}a${r*.62} ${r*.62} 0 0 1 ${r*.56} ${-r*.52}" fill="none" stroke="rgba(255,255,255,.55)" stroke-width=".8" stroke-linecap="round"/>`:''}`;}
  const options = [
    {key:'—',title:'現在の案',body:calendar+number+lens(15,20,9.4,paper),caption:'比較の基準。レンズの輪郭が強く、数字と同じくらい目立つ。'},
    {key:'A',title:'淡いレンズを重ねる',body:calendar+number+lens(15,20,9.4,faint,true),caption:'ご提案の方向。横線と同じ薄さに、小さな弧の反射。数字を主役に戻す。'},
    {key:'B',title:'虫眼鏡を右下にずらす',body:calendar+number+lens(23,23,7,faint,true),caption:'「10」の一部にレンズを重ねる。カレンダーと虫眼鏡を見分けやすくする。'},
    {key:'C',title:'「0」をレンズにする',body:calendar+number+`<path d="M23 24l2.5 2.5" stroke="${paper}" stroke-width="1.53" stroke-linecap="round"/><path d="M17.35 20.2C17.4 19.15 17.7 18.3 18.3 17.95" fill="none" stroke="rgba(255,255,255,.55)" stroke-width=".7" stroke-linecap="round"/>`,caption:'0に短く細い柄を添え、内側のカーブに沿った短い弧を反射にする。形を増やさず、レンズらしさを添える。'},
    {key:'D',title:'日付にフォーカスする',body:calendar+number+`<path d="M8 16v-3h3m10 0h3v3M8 24v3h3m10 0h3v-3" fill="none" stroke="rgba(255,255,255,.48)" stroke-width="1" stroke-linecap="round"/>`,caption:'虫眼鏡の代わりに四隅の枠で「検出」を表す。数字との干渉が少ない。'},
    {key:'E',title:'見つけた日付のきらめき',body:calendar+number+`<path d="M26 10l1.2 3.1 3.3 1.2-3.3 1.2-1.2 3.1-1.2-3.1-3.3-1.2 3.3-1.2z" fill="${paper}"/>`,caption:'小さな光で「発見」を添える。軽やかだが、AI機能を連想する可能性もある。'},
  ];
  function icon(option,size){return `<svg width="${size}" height="${size}" viewBox="-2 -2 38 38" role="img" aria-label="${option.title}">${option.body}</svg>`;}
  document.getElementById('options').innerHTML=options.map((option,index)=>`<article class="${index===0?'reference':''}"><h2><span>${option.key}</span>${option.title}</h2><div class="stage">${icon(option,128)}</div><div class="sizes">${[16,32,48].map(size=>`<div>${icon(option,size)}<small>${size}px</small></div>`).join('')}</div><p class="caption">${option.caption}</p></article>`).join('');
</script>
</html>
