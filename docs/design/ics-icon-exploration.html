<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ICSアイコンの検討 · Sche10le</title>
  <link rel="stylesheet" href="../../lib/theme.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.7 -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", sans-serif; }
    main { max-width: 1120px; margin: auto; padding: 48px 28px; }
    header { display: flex; align-items: start; justify-content: space-between; gap: 24px; margin-bottom: 32px; }
    h1 { margin: 0 0 6px; font-size: 25px; font-weight: 600; letter-spacing: .03em; }
    .intro, .note { margin: 0; color: var(--muted); font-size: 12px; }
    label { display: grid; gap: 4px; color: var(--muted); font-size: 11px; flex-shrink: 0; }
    select { color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px; font: inherit; font-size: 14px; min-height: 44px; }
    .grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 20px; }
    article { min-width: 0; border: 1px solid var(--line); border-radius: 18px; overflow: hidden; background: var(--surface); }
    .body { padding: 24px; }
    .heading { display: flex; gap: 12px; align-items: baseline; }
    .letter { font: 26px Georgia, serif; color: var(--accent); }
    h2 { margin: 0; font-size: 16px; font-weight: 600; }
    .body p { min-height: 42px; margin: 12px 0 0; font-size: 12px; color: var(--muted); }
    .study { display: flex; align-items: center; justify-content: center; gap: 48px; height: 132px; }
    .study figure { display: grid; justify-items: center; margin: 0; gap: 6px; }
    figcaption { font-size: 10px; color: var(--muted); }
    svg { display: block; width: 32px; height: 32px; color: var(--accent); fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
    .large { width: 72px; height: 72px; }
    svg text { stroke: none; fill: currentColor; font: 650 9px -apple-system, BlinkMacSystemFont, sans-serif; letter-spacing: .25px; text-anchor: middle; }
    .solid { fill: currentColor; stroke: none; }
    .reverse { color: var(--on-action); }
    .cutout { fill: var(--paper); stroke: none; }
    .actions { display: grid; grid-template-columns: minmax(0,1fr) 44px; gap: 8px; align-items: center; padding: 16px; border-top: 1px solid var(--line); background: var(--paper); }
    button { min-height: 44px; border-radius: 10px; border: 1px solid var(--line); color: var(--accent); background: transparent; cursor: pointer; font: inherit; }
    button:focus-visible, select:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
    .download { width: 44px; height: 44px; padding: 5px; display: grid; place-items: center; }
    .download:hover { background: var(--wash); border-color: var(--control-border); }
    .primary { background: var(--action); color: var(--on-action); border-color: var(--action); padding: 9px 6px; font-size: 13px; font-weight: 600; line-height: 1.55; }
    footer { margin-top: 24px; }
    #feedback { min-height: 24px; color: var(--accent); font-size: 12px; margin-top: 8px; }
    @media(max-width:680px) { main { padding: 24px 12px; } header { flex-wrap: wrap; gap: 16px; } h1 { font-size: 22px; } .grid { grid-template-columns: 1fr; gap: 16px; } .body { padding: 20px; } .actions { padding: 12px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div><h1>ICSを、ひとつの印に。</h1><p class="intro">C案を採用。上は拡大と実寸、下はカレンダーボタンとの並びです。</p></div>
      <label>配色<select id="theme"><option value="chitosemidori">千歳緑</option><option value="ginnezu">銀鼠</option><option value="mizuasagi">水浅葱</option><option value="aitetsu">藍鉄</option><option value="kurocha">黒茶</option><option value="shikon">紫紺</option></select></label>
    </header>
    <div class="grid" id="options"></div>
    <footer><p class="note">押せる領域は現行と同じ44 × 44px。図形と文字を一体化し、アイコンは32pxで表示。比較用のためダウンロードや外部遷移はしません。</p><div id="feedback" role="status"></div></footer>
  </main>
  <script>
    const variants = [
      { id: 'A', title: 'カレンダーの中にICS', description: 'ご提案の形。日付を扱うものだと伝わり、線だけなので控えめ。', shape: '<rect x="4" y="6" width="24" height="23" rx="4"/><path d="M10 3v6m12-6v6M4 12h24"/><text x="16" y="24">ICS</text>' },
      { id: 'B', title: '塗りのカレンダー', description: '小さくてもシルエットが明快。文字は白抜き。4案の中では少し存在感が強めです。', shape: '<rect class="solid" x="3" y="5" width="26" height="25" rx="5"/><path d="M10 2v6m12-6v6" stroke-width="2"/><path class="reverse" opacity=".45" d="M7 12h18"/><text class="reverse" x="16" y="24">ICS</text>' },
      { id: 'C', title: '取り出せるカレンダー（採用）', description: '右下の小さな矢印と受け皿で「ダウンロード」を補足。機能は伝わりやすく、少し情報量が増えます。', shape: '<rect x="3" y="5" width="24" height="23" rx="4"/><path d="M9 2v6m12-6v6M3 11h24"/><text x="15" y="22">ICS</text><rect class="cutout" x="21" y="19" width="11" height="13" rx="3"/><path d="M26 20v7m-3-3 3 3 3-3m-7 4v2h8v-2"/>' },
      { id: 'D', title: 'ICSファイル', description: '折り返しのある書類にICSを内包。予定のファイルとして持ち出すことが、素直に伝わります。', shape: '<path d="M8 3h12l6 6v18a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2ZM20 3v6h6"/><text x="16" y="23">ICS</text>' },
    ];
    function icon(shape, large = false) {
      return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" aria-hidden="true"${large ? ' class="large"' : ''}>${shape}</svg>`;
    }
    document.getElementById('options').innerHTML = variants.map(item => `<article data-option="${item.id}"><div class="body"><div class="heading"><span class="letter">${item.id}</span><h2>${item.title}</h2></div><div class="study"><figure>${icon(item.shape, true)}<figcaption>拡大</figcaption></figure><figure><button class="download" title="${item.id}案：予定をダウンロード（.ics）" aria-label="${item.id}案：予定をダウンロード（.ics）">${icon(item.shape)}</button><figcaption>実寸</figcaption></figure></div><p>${item.description}</p></div><div class="actions"><button class="primary">Googleカレンダーで開く ↗</button><button class="download" title="${item.id}案：予定をダウンロード（.ics）" aria-label="${item.id}案：予定をダウンロード（.ics）">${icon(item.shape)}</button></div></article>`).join('');
    document.getElementById('theme').addEventListener('change', event => {
      document.documentElement.dataset.theme = event.target.value;
    });
    document.querySelectorAll('button').forEach(button => button.addEventListener('click', () => {
      document.getElementById('feedback').textContent = `${button.closest('article').dataset.option}案の表示サンプルです。実際のダウンロードや外部遷移は行いません。`;
    }));
  </script>
</body>
</html>
