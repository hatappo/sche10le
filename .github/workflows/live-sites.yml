name: Live event sites

# Run after merging into main, never while a PR is being developed.
on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sites:
        description: "all、またはサイトIDのカンマ区切り（connpass,doorkeeper,peatix,techplay,kokuchpro,meetup,luma）"
        required: true
        default: all
        type: string

permissions:
  contents: read

concurrency:
  group: live-event-sites
  cancel-in-progress: false

jobs:
  live:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LIVE_SITES: ${{ inputs.sites || 'all' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Pull prepared Playwright environment
        timeout-minutes: 5
        run: docker pull "$(cat scripts/ci/playwright-image.txt)"
      - name: Install project dependencies
        timeout-minutes: 3
        run: bash scripts/ci/run-playwright.sh npm ci
      - name: Review sample age without accessing sites
        shell: bash
        run: bash scripts/ci/run-playwright.sh node scripts/check-live-samples.js | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Check image compatibility and build
        timeout-minutes: 2
        run: |
          bash scripts/ci/run-playwright.sh npm test
          bash scripts/ci/run-playwright.sh npm run build
      - name: Check extension in sandbox with a local fixture
        timeout-minutes: 2
        run: bash scripts/ci/run-playwright.sh npx playwright test tests/e2e/live-harness.spec.js --reporter=line
      - name: Verify live event sites
        run: bash scripts/ci/run-playwright.sh npm run test:live
      - name: Publish date-only summary
        if: always()
        run: |
          if [ -f test-results/live/summary.md ]; then
            cat test-results/live/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload date-only report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: live-event-sites-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/live/report.json
            test-results/live/summary.md
          if-no-files-found: warn
          retention-days: 14
